global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # node-exporter runs with network_mode: host (see docker-compose.yml), so
  # it isn't reachable by service name on the compose network - scrape it
  # via automation01's own LAN IP instead.
  - job_name: node-exporter
    static_configs:
      - targets: ["192.168.1.20:9100"]
