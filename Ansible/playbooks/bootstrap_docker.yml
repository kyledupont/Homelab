---
# New work, not copying an existing pattern: every current playbook
# (deploy_postgres.yml, deploy_plex.yml) explicitly assumes Docker is already
# installed (see Docs/Ansible.md - "this playbook does not install Docker...
# assumes Docker already exists, which it does on every host in this lab").
# classcompass01 is the first host in this repo that actually needs that step
# automated, since it wasn't hand-set-up like automation01/plex01 were.
# Installs Docker Engine + the Compose plugin from Docker's own apt repo
# (not Ubuntu's docker.io/docker-compose-v2 packages, which lag upstream).
- name: Bootstrap Docker on classcompass01
  hosts: classcompass01
  become: true

  tasks:
    - name: Check whether Docker is already installed
      ansible.builtin.command: docker --version
      register: docker_check
      changed_when: false
      failed_when: false

    - name: Install Docker Engine + Compose plugin (Docker's official apt repo)
      when: docker_check.rc != 0
      block:
        - name: Install prerequisite packages
          ansible.builtin.apt:
            name:
              - ca-certificates
              - curl
              - gnupg
            state: present
            update_cache: true

        - name: Ensure the apt keyring directory exists
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            mode: "0755"

        - name: Download Docker's official GPG key
          ansible.builtin.get_url:
            url: https://download.docker.com/linux/ubuntu/gpg
            dest: /etc/apt/keyrings/docker.asc
            mode: "0644"

        - name: Add Docker's apt repository
          ansible.builtin.apt_repository:
            repo: >-
              deb [arch={{ ansible_architecture | replace('x86_64', 'amd64') }}
              signed-by=/etc/apt/keyrings/docker.asc]
              https://download.docker.com/linux/ubuntu
              {{ ansible_distribution_release }} stable
            state: present
            filename: docker

        - name: Install Docker Engine, CLI, and Compose plugin
          ansible.builtin.apt:
            name:
              - docker-ce
              - docker-ce-cli
              - containerd.io
              - docker-compose-plugin
            state: present
            update_cache: true

        - name: Add kyle to the docker group (so sudo isn't needed for docker compose)
          ansible.builtin.user:
            name: "{{ vm_user | default('kyle') }}"
            groups: docker
            append: true

        - name: Ensure the Docker service is enabled and running
          ansible.builtin.systemd:
            name: docker
            enabled: true
            state: started

    - name: Confirm Docker is present
      ansible.builtin.command: docker --version
      register: docker_version
      changed_when: false

    - name: Show Docker version found
      ansible.builtin.debug:
        msg: "{{ docker_version.stdout }}"
